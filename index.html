<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Butterfly Effect</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: Impact, "Arial Black", sans-serif;

      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      text-align: left;
      margin-bottom: 40px;
      border-bottom: 8px solid #ffffff;
      padding-bottom: 20px;
    }

    h1 {
      font-size: 72px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1;

    }

    .sub {
      font-size: 28px;
      color: #ffff00;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      font-weight: 900;
    }

    label {
      display: block;
      margin-bottom: 12px;
      font-weight: 900;
      color: #ffffff;

      text-transform: uppercase;

    }

    input[type="text"] {
      width: 100%;
      padding: 24px;

      border: 8px solid #dba1b4;

      font-family: Arial, sans-serif;

      margin-bottom: 24px;

    input[type="text"]:focus {
      border-color: #630404;
      background: #ffffff;
    }

    .btn-row {
      display: block;
    }

    button {
      width: 100%;
      background: #020001;
      color: #ffffff;
      border: 6px solid #ffffff;
      border-radius: 0;
      padding: 24px 40px;
      font-family: Impact, "Arial Black", sans-serif;
      font-weight: 900;
      font-size: 36px;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
    }

    button:hover {
      background: #ffffff;
      color: #000000;
      border-color: #420202;
    }

    .quick-picks {
      margin-top: 40px;
      font-size: 24px;
      color: #ffffff;
      font-family: Arial, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }

    .tag {
      color: #000000;
      cursor: pointer;
      border: 4px solid #ffffff;
      background: #ffff00;
      padding: 12px 24px;
      border-radius: 0;
      margin-right: 12px;
      margin-top: 16px;
      display: inline-block;
      font-size: 20px;
      font-weight: 900;
      font-family: Arial, sans-serif;
      text-transform: uppercase;
    }

    .tag:hover {
      background: #ffffff;
      color: #000000;
    }

    #output {
      margin-top: 50px;
    }

    .step-card {
      background: #111111;
      border: 6px solid #ffffff;
      border-left: 20px solid #ffff00;
      border-radius: 0;
      padding: 30px;
      margin-bottom: 24px;
      font-size: 28px;
      font-family: Arial, sans-serif;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .step-num {
      color: #ff0055;
      font-weight: 900;
      margin-bottom: 10px;
      font-size: 24px;
      font-family: Impact, "Arial Black", sans-serif;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    footer {
      text-align: left;
      font-size: 20px;
      font-family: Arial, sans-serif;
      font-weight: 900;
      color: #888888;
      margin-top: 60px;
      border-top: 4px solid #333333;
      padding-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Butterfly Effect Generator</h1>
  <div class="sub">
    Type in something that happened to you
  </div>
  <div class="box">
    <label for="user-event">What happened?</label>
    <input
      type="text"
      id="user-event"
      placeholder="e.g. Dropped my toast on the floor"
      autocomplete="off"
    />
    <div class="btn-row">
      <button id="go-btn">RUN IT </button>
    </div>
    <div class="quick-picks">
      <span>Try these:</span>
      <span
        class="tag"
        onclick="setPreset('Snoozed my alarm for 5 mins')"
      >
        Snoozed alarm
      </span>
      <span
        class="tag"
        onclick="setPreset('Spilled water on my shirt')"
      >
        Spilled water
      </span>
      <span
        class="tag"
        onclick="setPreset('Waved at someone who was waving at someone else')"
      >
        Awkward wave
      </span>
    </div>
  </div>
  <div id="output"></div>
  <footer>
    ts thing DOES NOT run well gng 🫩✌️
    <br> <br>
    <img src="pics/watches.jpg" width="180px" height="180px">
    <img src="pics/ac.jpg" style="width: 400px; height: 150px; padding-left: 50px;">
  </footer>
<script>

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}
function uniqueRandom(pool, usedSet) {
  const available = pool.filter(item => !usedSet.has(item));
  if (available.length === 0) {
    return random(pool);
  }
  const result = random(available);
  usedSet.add(result);
  return result;
}
function escapeHTML(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function analyseInput(text) {
  const clean = text
    .toLowerCase()
    .replace(/[^\w\s]/g, " ");
  const words = clean
    .split(/\s+/)
    .filter(word => word.length > 2);
  const stopWords = new Set([
    "the",
    "and",
    "for",
    "with",
    "that",
    "this",
    "from",
    "have",
    "was",
    "were",
    "are",
    "you",
    "your",
    "just",
    "into",
    "then",
    "than",
    "they",
    "them",
    "someone",
    "something",
    "about",
    "because",
    "after",
    "before",
    "very",
    "really",
    "some",
    "my",
    "our",
    "his",
    "her",
    "its"
  ]);
  const importantWords = words.filter(
    word => !stopWords.has(word)
  );
  const joined = importantWords.join(" ");
  let category = "general";
  const categories = {
    food: [
      "toast",
      "food",
      "pizza",
      "burger",
      "sandwich",
      "cake",
      "rice",
      "bread",
      "coffee",
      "tea",
      "drink",
      "water",
      "juice",
      "eat",
      "ate",
      "eating",
      "spilled"
    ],

    school: [
      "school",
      "class",
      "teacher",
      "homework",
      "exam",
      "test",
      "student",
      "lesson",
      "book",
      "math",
      "science",
      "sports"
    ],

    technology: [
      "phone",
      "computer",
      "laptop",
      "internet",
      "wifi",
      "app",
      "website",
      "code",
      "coding",
      "game",
      "keyboard",
      "mouse",
      "charger",
      "battery"
    ],

    travel: [
      "bus",
      "train",
      "car",
      "flight",
      "airport",
      "travel",
      "trip",
      "taxi",
      "road",
      "station"
    ],

    social: [
      "wave",
      "waved",
      "friend",
      "someone",
      "awkward",
      "message",
      "text",
      "call",
      "talk",
      "conversation",
      "film"
    ],

    object: [
      "keys",
      "key",
      "bag",
      "shirt",
      "shoe",
      "umbrella",
      "pen",
      "pencil",
      "chair",
      "door",
      "window",
      "ball"
    ],

    weather: [
      "rain",
      "raining",
      "sun",
      "hot",
      "cold",
      "weather",
      "storm",
      "wind",
      "snow"
    ]
  };
  for (const [name, keywords] of Object.entries(categories)) {
    if (
      keywords.some(keyword =>
        importantWords.includes(keyword)
      )
    ) {
      category = name;
      break;
    }
  }
  return {
    original: text,
    words: importantWords,
    anchor:
      importantWords.length > 0
        ? importantWords.slice(0, 3).join(" ")
        : "the incident",

    category
  };
}
const VOCAB = {
  general: {
    people: [
      "a confused passerby",
      "someone nearby",
      "a suspiciously observant stranger",
      "a person who happened to be walking past",
      "an overly enthusiastic witness",
      "a local shopkeeper",
      "a completely unrelated tourist",
      "a tuff 13yr old phonk listener"
    ],

    places: [
      "the nearest street corner",
      "a nearby shop",
      "the sidewalk",
      "a crowded public place",
      "the nearest bus stop",
      "a quiet neighborhood",
      "the place where you least expected it",
      "a concert"
    ],

    consequences: [
      "someone notices the situation",
      "the tiny incident becomes 230% harder to ignore",
      "another person gets involved for absolutely no reason",
      "the situation develops a life of its own",
      "a completely unnecessary chain of events begins",
      "an influencer ends up making a dance reel on it with a tuff bg music and it doesn't go viral",
      "a sleep deprived unemployed person ends up making a 10hr yt video on it and it goes viral"
    ]

  },
  food: {
    people: [
      "a hungry passerby",
      "the person behind the counter",
      "a food delivery rider",
      "someone waiting for their order",
      "a very judgmental customer",
      "a local baker"
    ],

    places: [
      "the nearest café",
      "a crowded food court",
      "the bakery across the street",
      "a tiny neighborhood restaurant",
      "the kitchen",
      "the nearest convenience store"
    ],

    consequences: [
      "someone assumes there must be a food-related emergency",
      "another person tries to help before understanding what happened",
      "the incident attracts the attention of everyone waiting nearby",
      "someone starts giving completely unnecessary cooking advice",
      "the mess somehow becomes everyone's problem"
    ]
  },
  school: {
    people: [
      "a classmate",
      "the teacher",
      "someone from the next classroom",
      "the student sitting nearby",
      "the class monitor",
      "a teacher who happened to walk past"
    ],

    places: [
      "the classroom",
      "the hallway",
      "the school library",
      "the corridor outside the classroom",
      "the cafeteria",
      "the school gate"
    ],

    consequences: [
      "someone assumes it was part of an assignment",
      "the story reaches another classroom",
      "a completely unrelated student gets dragged into it",
      "someone begins explaining what happened to people who weren't even there",
      "the incident becomes today's unofficial classroom topic"
    ]
  },
  technology: {
    people: [
      "a confused friend",
      "someone sitting nearby",
      "a tech-savvy classmate",
      "the person you last messaged",
      "a random internet stranger",
      "someone who thinks they understand technology"
    ],

    places: [
      "your room",
      "the nearest café",
      "a computer lab",
      "the group chat",
      "a random corner of the internet",
      "the device sitting in front of you"
    ],

    consequences: [
      "someone assumes the device is broken",
      "another person tries to fix it without being asked",
      "the problem gets discussed in a group chat",
      "someone suggests an unnecessarily complicated solution",
      "the tiny technical problem becomes strangely important"
    ]
  },

  travel: {
    people: [
      "a confused passenger",
      "the driver",
      "another traveler",
      "a station employee",
      "someone waiting nearby",
      "a tourist who clearly has no idea what's happening"
    ],

    places: [
      "the nearest station",
      "the bus stop",
      "the road ahead",
      "the airport",
      "the waiting area",
      "the next intersection"
    ],

    consequences: [
      "someone thinks the schedule has changed",
      "another passenger gets involved",
      "the delay affects someone else's plans",
      "people begin asking what happened",
      "a tiny delay creates another tiny delay"
    ]
  },
  social: {
    people: [
      "the person involved",
      "a mutual friend",
      "someone standing nearby",
      "a very confused witness",
      "someone who completely misreads the situation",
      "a friend who hears about it later"
    ],

    places: [
      "the sidewalk",
      "the group chat",
      "the hallway",
      "a nearby café",
      "the place where everyone happened to meet",
      "your messages"
    ],

    consequences: [
      "someone interprets the situation completely differently",
      "another person hears only half the story",
      "the awkward moment becomes a conversation",
      "someone brings it up again later",
      "the misunderstanding gains another misunderstanding"
    ]
  },
  object: {
    people: [
      "a passerby",
      "a friend",
      "someone nearby",
      "the owner of the object",
      "a curious stranger",
      "someone who thinks they can fix it"
    ],

    places: [
      "the sidewalk",
      "your room",
      "the nearest shop",
      "the hallway",
      "a public bench",
      "the place where you left it"
    ],

    consequences: [
      "someone notices the object",
      "another person assumes it belongs to them",
      "the object ends up somewhere unexpected",
      "someone tries to help",
      "the missing object becomes surprisingly important"
    ]
  },
  weather: {
    people: [
      "a passerby",
      "a delivery rider",
      "someone carrying an umbrella",
      "a neighbor",
      "another person caught outside",
      "a weather-obsessed stranger"
    ],

    places: [
      "the sidewalk",
      "the nearest shelter",
      "a bus stop",
      "a nearby shop",
      "the street corner",
      "the park"
    ],

    consequences: [
      "someone nearby reacts to the weather",
      "another person changes their plans",
      "everyone starts looking for somewhere to hide",
      "the weather changes what happens next",
      "a tiny inconvenience affects someone else's schedule"
    ]
  }
};
const EVENT_TYPES = {
  observation: (state, vocab) => {
    const person = uniqueRandom(
      vocab.people,
      state.usedPeople
    );
    const place = uniqueRandom(
      vocab.places,
      state.usedPlaces
    );
    return random([
      `${person} notices the ${state.anchor} situation while passing through ${place}.`,
      `The ${state.anchor} incident catches the attention of ${person} near ${place}.`,
      `At ${place}, ${person} becomes one of the first people to notice what happened.`,
      `${person} sees the aftermath of the ${state.anchor} incident and stops for a moment.`
    ]);
  },
  misunderstanding: (state, vocab) => {
    const person = uniqueRandom(
      vocab.people,
      state.usedPeople
    );

    return random([

      `${person} gets the wrong idea about the ${state.anchor} incident and tells someone else.`,
      `Unfortunately, ${person} only sees part of what happened and comes to a completely different conclusion.`,
      `The story reaches ${person}, but one important detail gets lost along the way.`,
      `${person} explains the ${state.anchor} situation to someone else — with several details mysteriously changed.`
    ]);
  },

  involvement: (state, vocab) => {
    const person = uniqueRandom(
      vocab.people,
      state.usedPeople
    );

    const place = uniqueRandom(
      vocab.places,
      state.usedPlaces
    );

    return random([
      `${person} decides to get involved, turning the original problem into a group problem at ${place}.`,
      `Because of the misunderstanding, ${person} tries to help at ${place}.`,
      `${person} arrives at ${place} expecting one thing and accidentally gets involved in the ${state.anchor} situation.`,
      `Someone decides the ${state.anchor} incident needs to be dealt with immediately, so ${person} steps in.`
    ]);
  },
  complication: (state, vocab) => {
    const consequence = uniqueRandom(
      vocab.consequences,
      state.usedConsequences
    );

    return random([
      `That would have been the end of it, except ${consequence}.`,
      `The problem should have stopped there. Instead, ${consequence}.`,
      `For a moment, everything seems normal again — until ${consequence}.`,
      `The situation becomes slightly stranger when ${consequence}.`
    ]);
  },
  spread: (state) => {
    const destinations = [
      "a group chat",
      "a conversation nearby",
      "a local community",
      "someone else's messages",
      "a completely unrelated conversation",
      "the internet"
    ];

    const destination = uniqueRandom(
      destinations,
      state.usedDestinations
    );

    return random([
      `By now, the story has reached ${destination}, although nobody agrees on exactly what happened.`,
      `The ${state.anchor} story somehow makes its way into ${destination}.`,
      `Someone mentions the incident in ${destination}, accidentally giving it a second life.`,
      `The original event is now being discussed in ${destination}, where the details become even less reliable.`
    ]);
  },
  escalation: (state, vocab) => {

    const person = uniqueRandom(
      vocab.people,
      state.usedPeople
    );

    return random([

      `${person} takes the increasingly complicated situation far more seriously than necessary.`,
      `At this point, ${person} decides there must be a bigger explanation behind the ${state.anchor} incident.`,
      `The situation attracts someone who is convinced they can solve everything.`,
      `What started as a tiny ${state.anchor} problem now has people trying to figure out why it happened at all.`
    ]);
  },
  consequence: (state) => {

    const endings = [
      `The strange part is that none of this would have happened if the original ${state.anchor} incident had gone normally.`,
      `And somehow, everyone involved can trace the entire mess back to the original ${state.anchor}.`,
      `By the end of the day, the chain of events has become much bigger than the tiny ${state.anchor} incident that started it.`,
      `Nobody realizes how important that first little ${state.anchor} moment was until much later.`,
      `The final consequence is completely unrelated to what you originally intended — but it can still be traced back to ${state.anchor}.`
    ];

    return uniqueRandom(
      endings,
      state.usedEndings
    );
  },
  absurdEnding: (state) => {
    const endings = [

      `Eventually, someone writes a completely unnecessary article about the entire ${state.anchor} saga.`,
      `Months later, people are still referring to it as "the ${state.anchor} incident."`,
      `A local legend somehow forms around the original ${state.anchor} event.`,
      `The story becomes one of those bizarre memories everyone involved remembers differently.`,
      `Someone eventually turns the entire chain of events into an inside joke.`,
      `The incident becomes so strangely memorable that people start using it as a reference point for other ridiculous situations.`
    ];
    return uniqueRandom(
      endings,
      state.usedEndings
    );
  }
};

const STORY_PATTERNS = [

  [
    "observation",
    "misunderstanding",
    "involvement",
    "complication",
    "spread",
    "escalation",
    "consequence"
  ],

  [
    "observation",
    "complication",
    "involvement",
    "spread",
    "misunderstanding",
    "escalation",
    "absurdEnding"
  ],

  [
    "observation",
    "spread",
    "misunderstanding",
    "complication",
    "involvement",
    "consequence"
  ],

  [
    "observation",
    "involvement",
    "complication",
    "misunderstanding",
    "spread",
    "escalation",
    "absurdEnding"
  ],

  [
    "observation",
    "complication",
    "spread",
    "involvement",
    "escalation",
    "consequence"
  ],

  [
    "observation",
    "misunderstanding",
    "spread",
    "complication",
    "involvement",
    "absurdEnding"
  ]

];

function chooseStoryPattern(totalSteps) {
  const possible = STORY_PATTERNS
    .filter(pattern => pattern.length >= totalSteps);
  if (possible.length === 0) {
    return shuffle(STORY_PATTERNS[0]).slice(0, totalSteps);
  }
  return random(possible).slice(0, totalSteps);
}
function generateChain() {
  const inputElement =
    document.getElementById("user-event");
  const outputDiv =
    document.getElementById("output");
  const rawInput =
    inputElement.value.trim();
  if (!rawInput) {
    alert("Type something first!");
    return;
  }
  const analysis =
    analyseInput(rawInput);
  const totalSteps =
    Math.floor(Math.random() * 5) + 4;
  
  const state = {
    original: analysis.original,
    anchor: analysis.anchor,
    category: analysis.category,
    usedPeople: new Set(),
    usedPlaces: new Set(),
    usedConsequences: new Set(),
    usedDestinations: new Set(),
    usedEndings: new Set()
  };

  const vocab =
    VOCAB[state.category] || VOCAB.general;
  const pattern =
    chooseStoryPattern(totalSteps);
  let html = "";
  html += `
    <div class="step-card">
      <div class="step-num">
        STEP 0: THE START
      </div>

      <div>
        "${escapeHTML(rawInput)}"
      </div>
    </div>
  `;

  pattern.forEach((eventType, index) => {
    const generator =
      EVENT_TYPES[eventType];
    if (!generator) {
      return;
    }
    const sentence =
      generator(state, vocab);
    html += `
      <div class="step-card">
        <div class="step-num">
          STEP ${index + 1}
        </div>
        <div>
          ${escapeHTML(sentence)}
        </div>
      </div>
    `;
  });
  outputDiv.innerHTML = html;
  setTimeout(() => {
    outputDiv.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });

  }, 50);
}
function setPreset(text) {
  document.getElementById(
    "user-event"
  ).value = text;

}

document
  .getElementById("go-btn")
  .addEventListener("click", generateChain);
document
  .getElementById("user-event")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      generateChain();
    }
  });

</script>
</body>
</html>
